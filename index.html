<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner OCR con Zoom</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #container { position: relative; width: 100%; max-width: 400px; margin: 0 auto; }
        #video { width: 100%; border-radius: 8px; background: #000; }
        #overlay {
            position: absolute;
            top: 30%; left: 10%;
            width: 80%; height: 40%;
            border: 3px solid #00ff00;
            pointer-events: none;
            box-sizing: border-box;
        }
        .controls { margin-top: 20px; }
        #zoomSlider { width: 80%; }
        ul { text-align: left; max-width: 400px; margin: 20px auto; }
    </style>
</head>
<body>

    <h3>Scanner OCR</h3>
    
    <div id="container">
        <video id="video" autoplay playsinline></video>
        <div id="overlay"></div>
    </div>

    <div class="controls">
        <label>Zoom:</label><br>
        <input type="range" id="zoomSlider" min="1" max="5" step="0.1" value="1"><br><br>
        <button onclick="capturar()">Escanear Rectángulo</button>
    </div>

    <ul id="listaResultados"></ul>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const slider = document.getElementById('zoomSlider');
        const lista = document.getElementById('listaResultados');
        let videoTrack;

        // Iniciar cámara trasera
        navigator.mediaDevices.getUserMedia({ 
            video: { facingMode: { exact: "environment" } } 
        })
        .then(stream => {
            video.srcObject = stream;
            videoTrack = stream.getVideoTracks()[0];
        })
        .catch(err => alert("Error al acceder a la cámara: " + err));

        // Lógica de Zoom
        slider.addEventListener('input', async () => {
            if (videoTrack && videoTrack.getCapabilities().zoom) {
                await videoTrack.applyConstraints({
                    advanced: [{ zoom: parseFloat(slider.value) }]
                });
            }
        });

        // Lógica de OCR
        async function capturar() {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            // Obtener coordenadas del recuadro rojo
            const videoRect = video.getBoundingClientRect();
            const overlayRect = overlay.getBoundingClientRect();

            // Calcular escala (por si el video no ocupa el 100% del tamaño real)
            const scaleX = video.videoWidth / videoRect.width;
            const scaleY = video.videoHeight / videoRect.height;

            canvas.width = overlayRect.width;
            canvas.height = overlayRect.height;

            // Recortar lo que hay dentro del recuadro
            context.drawImage(video, 
                (overlayRect.left - videoRect.left) * scaleX, 
                (overlayRect.top - videoRect.top) * scaleY, 
                overlayRect.width * scaleX, 
                overlayRect.height * scaleY, 
                0, 0, canvas.width, canvas.height
            );
            
            // Procesar con Tesseract
            const { data: { text } } = await Tesseract.recognize(canvas.toDataURL(), 'spa');
            
            if (text.trim()) {
                const li = document.createElement('li');
                li.textContent = text.trim();
                lista.appendChild(li);
            } else {
                alert("No se detectó texto.");
            }
        }
    </script>
</body>
</html>
