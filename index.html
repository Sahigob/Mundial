<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Scanner FIFA 2026</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { margin: 0; background: black; overflow: hidden; }
        #video { width: 100vw; height: 100vh; object-fit: cover; }
        #rectangulo {
            position: absolute;
            top: 5%; right: 5%;
            width: 35%; height: 10%;
            border: 5px solid yellow;
            box-shadow: 0 0 20px yellow;
        }
        #lista { position: absolute; bottom: 20px; left: 20px; color: white; background: rgba(0,0,0,0.7); padding: 10px; max-height: 200px; overflow-y: auto; }
    </style>
</head>
<body>

    <video id="video" autoplay playsinline></video>
    <div id="rectangulo"></div>
    <div id="lista">Escaneando...</div>

<script>
    const video = document.getElementById('video');
    const lista = document.getElementById('lista');
    let inventario = {};

    navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
        .then(stream => { video.srcObject = stream; });

    // Escaneo automático cada 2 segundos
    setInterval(async () => {
        const canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext("2d").drawImage(video, 0, 0);

        // Recorte preciso: Esquina superior derecha
        const x = video.videoWidth * 0.60;
        const y = video.videoHeight * 0.05;
        const w = video.videoWidth * 0.35;
        const h = video.videoHeight * 0.10;

        Tesseract.recognize(canvas, 'eng', { logger: () => {} })
            .then(({ data: { text } }) => {
                const lectura = text.toUpperCase().replace(/[^A-Z0-9]/g, '');
                // Buscar patrón: 3 letras + números (ej: FWC01, MEX15)
                const match = lectura.match(/([A-Z]{3})(\d+)/);
                
                if (match) {
                    const codigo = match[0];
                    inventario[codigo] = (inventario[codigo] || 0) + 1;
                    actualizarUI(codigo);
                }
            });
    }, 2000);

    function actualizarUI(ultimo) {
        lista.innerHTML = `Detectado: ${ultimo}<br>Total: ${Object.keys(inventario).length} únicos`;
    }
</script>
</body>
</html>
