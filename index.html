<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>OCR en Cámara</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        #container { position: relative; width: 100%; max-width: 500px; }
        #video { width: 100%; border-radius: 8px; }
        #overlay {
            position: absolute;
            top: 25%; left: 25%;
            width: 50%; height: 20%;
            border: 3px solid red;
            pointer-events: none; /* Para que puedas hacer clic detrás */
        }
    </style>
</head>
<body>

    <div id="container">
        <video id="video" autoplay playsinline></video>
        <div id="overlay"></div>
    </div>
    <button onclick="capturar()">Escanear Rectángulo</button>
    <ul id="listaResultados"></ul>

    <script>
        const video = document.getElementById('video');
        const overlay = document.getElementById('overlay');
        const lista = document.getElementById('listaResultados');

        // Iniciar cámara
        navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
            .then(stream => { video.srcObject = stream; });

        async function capturar() {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            
            // Ajustar proporciones del área delimitada
            const rect = overlay.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;

            context.drawImage(video, rect.left, rect.top, rect.width, rect.height, 0, 0, rect.width, rect.height);
            
            // OCR
            const { data: { text } } = await Tesseract.recognize(canvas.toDataURL(), 'spa');
            
            // Agregar a lista
            if (text.trim()) {
                const li = document.createElement('li');
                li.textContent = text.trim();
                lista.appendChild(li);
            }
        }
    </script>
</body>
</html>
