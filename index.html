<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GeoFichaje</title>

<style>
:root{
  --bg:#f3f7f6;
  --card:#ffffff;
  --text:#1f2937;
  --muted:#6b7280;
  --green:#16a34a;
  --red:#dc2626;
  --blue:#2563eb;
  --border:#dbe4e1;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:480px;
  margin:0 auto;
  padding:18px 16px 28px;
}

h1{
  margin:8px 0 2px;
  font-size:30px;
}

.sub{
  color:var(--muted);
  font-size:14px;
  margin-bottom:18px;
}

.card{
  background:var(--card);
  border-radius:18px;
  padding:16px;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
  margin-bottom:14px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  font-size:12px;
  font-weight:700;
}

.ok{
  background:#dcfce7;
  color:#166534;
}

.off{
  background:#fee2e2;
  color:#991b1b;
}

.info{
  background:#dbeafe;
  color:#1d4ed8;
}

button{
  width:100%;
  border:none;
  border-radius:14px;
  padding:14px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:var(--blue);
  color:white;
}

.danger{
  background:var(--red);
  color:white;
}

.secondary{
  background:#eef2ff;
  color:#3730a3;
}

input,
select{
  width:100%;
  padding:12px;
  border-radius:12px;
  border:1px solid var(--border);
  margin-top:6px;
  margin-bottom:10px;
  font-size:15px;
}

label{
  font-size:13px;
  color:var(--muted);
  font-weight:600;
}

.small{
  font-size:12px;
  color:var(--muted);
}

.history-item{
  border-top:1px solid #edf2f0;
  padding:10px 0;
}

.history-item:first-child{
  border-top:none;
  padding-top:0;
}

.dot{
  width:10px;
  height:10px;
  border-radius:50%;
  background:var(--green);
  display:inline-block;
  margin-right:6px;
}

.footer{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

  <h1>📍 GeoFichaje</h1>
  <div class="sub">
    Registro de jornada por localización
  </div>

  <!-- ESTADO -->
  <div class="card">

    <div class="row">
      <strong>Estado</strong>

      <span id="statusBadge" class="badge off">
        Fuera
      </span>
    </div>

    <div style="margin-top:12px">

      <div class="small">
        Centro detectado
      </div>

      <div id="currentSite"
           style="font-size:20px;font-weight:700">
        —
      </div>

    </div>

    <div class="row" style="margin-top:14px">

      <div>
        <div class="small">
          Entrada
        </div>

        <div id="entryTime"
             style="font-weight:700">
          --:--
        </div>
      </div>

      <div style="text-align:right">

        <div class="small">
          Tiempo
        </div>

        <div id="worked"
             style="font-weight:700">
          0 h
        </div>

      </div>

    </div>

    <div style="margin-top:14px">

      <button id="geoBtn"
              class="primary">
        Activar localización
      </button>

      <div style="height:8px"></div>

      <div class="row" style="gap:8px">

        <button id="manualIn"
                class="secondary"
                type="button">
          Fichar entrada
        </button>

        <button id="manualOut"
                class="danger"
                type="button">
          Fichar salida
        </button>

      </div>

    </div>

    <div id="geoMsg"
         class="small"
         style="margin-top:8px">
    </div>

  </div>


  <!-- CENTROS -->
  <div class="card">

    <strong>
      Mis centros
    </strong>

    <div style="margin-top:12px">

      <label>
        Nombre
      </label>

      <input id="name"
             placeholder="Oreka">


      <label>
        Latitud
      </label>

      <input id="lat"
             type="number"
             step="any"
             placeholder="40.438...">


      <label>
        Longitud
      </label>

      <input id="lon"
             type="number"
             step="any"
             placeholder="-3.716...">


      <label>
        Radio (metros)
      </label>

      <input id="radius"
             type="number"
             value="60">


      <button id="useLocation"
              class="secondary"
              type="button">

        Usar mi ubicación actual

      </button>


      <div style="height:8px"></div>


      <button id="saveSite"
              class="primary">

        Guardar centro

      </button>

    </div>

    <div id="sitesList"
         class="small"
         style="margin-top:12px">
    </div>

  </div>


  <!-- HISTORIAL -->
  <div class="card">

    <div class="row">

      <strong>
        Historial
      </strong>

      <button id="clear"
              style="
                width:auto;
                padding:8px 12px;
                background:#f3f4f6;
                color:#374151;
                border-radius:10px
              ">

        Borrar

      </button>

    </div>

    <div id="history"
         style="margin-top:10px">
    </div>

  </div>


  <div class="footer">

    Los datos permanecen en este dispositivo
    (LocalStorage).

    Para usarla en iPhone, sirve este archivo
    desde HTTPS y ábrelo con Safari.

  </div>

</div>


<script>

const LS_SITES = "geo_sites_v1";
const LS_LOGS = "geo_logs_v1";
const LS_ACTIVE = "geo_active_v1";

let watchId = null;
let timer = null;

const $ = id =>
  document.getElementById(id);


function load(key, fallback){

  return JSON.parse(
    localStorage.getItem(key)
    ||
    JSON.stringify(fallback)
  );

}


function save(key, val){

  localStorage.setItem(
    key,
    JSON.stringify(val)
  );

}


let sites = load(
  LS_SITES,
  []
);

let logs = load(
  LS_LOGS,
  []
);

let active = load(
  LS_ACTIVE,
  null
);


function formatTime(d){

  const x = new Date(d);

  return x.toLocaleTimeString(
    "es-ES",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function formatDate(d){

  return new Date(d)
    .toLocaleDateString(
      "es-ES",
      {
        day:"2-digit",
        month:"2-digit",
        year:"numeric"
      }
    );

}


function hours(ms){

  const m =
    Math.floor(ms / 60000);

  const h =
    Math.floor(m / 60);

  const mm =
    m % 60;

  return `${h} h ${mm} min`;

}


function distance(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R = 6371000;

  const toRad =
    x => x * Math.PI / 180;

  const dLat =
    toRad(lat2 - lat1);

  const dLon =
    toRad(lon2 - lon1);

  const a =
    Math.sin(dLat / 2) ** 2 +

    Math.cos(toRad(lat1)) *
    Math.cos(toRad(lat2)) *
    Math.sin(dLon / 2) ** 2;

  return 2 * R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1 - a)
    );

}


function renderSites(){

  if(!sites.length){

    $("sitesList").innerHTML =
      "No hay centros guardados.";

    return;

  }


  $("sitesList").innerHTML =
    sites.map((s,i) => `

      <div
        style="
          display:flex;
          justify-content:space-between;
          padding:8px 0;
          border-top:1px solid #edf2f0
        "
      >

        <div>

          <strong>
            ${s.name}
          </strong>

          <br>

          ${s.radius} m

        </div>


        <button
          onclick="removeSite(${i})"
          style="
            width:auto;
            background:#fee2e2;
            color:#991b1b;
            padding:6px 10px;
            border-radius:8px
          "
        >

          ✕

        </button>

      </div>

    `).join("");

}


window.removeSite = i => {

  sites.splice(i,1);

  save(
    LS_SITES,
    sites
  );

  renderSites();

};


function renderHistory(){

  if(!logs.length){

    $("history").innerHTML =
      '<div class="small">Todavía no hay jornadas registradas.</div>';

    return;

  }


  $("history").innerHTML =
    [...logs]
      .reverse()
      .map(l => {

        const total =
          l.out
          ?
          hours(
            new Date(l.out) -
            new Date(l.in)
          )
          :
          "En curso";


        return `

          <div class="history-item">

            <div class="row">

              <div>

                <span class="dot"></span>

                <strong>
                  ${l.site}
                </strong>

              </div>

              <div class="small">

                ${formatDate(l.in)}

              </div>

            </div>


            <div
              class="row"
              style="margin-top:6px"
            >

              <div>

                ${formatTime(l.in)}
                →
                ${l.out
                  ? formatTime(l.out)
                  : "..."
                }

              </div>

              <strong>
                ${total}
              </strong>

            </div>

          </div>

        `;

      })
      .join("");

}


function updateUI(){

  if(active){

    $("statusBadge").textContent =
      "Trabajando";

    $("statusBadge").className =
      "badge ok";

    $("currentSite").textContent =
      active.site;

    $("entryTime").textContent =
      formatTime(active.in);

    const ms =
      Date.now() -
      new Date(active.in);

    $("worked").textContent =
      hours(ms);

  }

  else{

    $("statusBadge").textContent =
      "Fuera";

    $("statusBadge").className =
      "badge off";

    $("currentSite").textContent =
      "—";

    $("entryTime").textContent =
      "--:--";

    $("worked").textContent =
      "0 h";

  }

}


function startShift(site){

  if(active)
    return;


  active = {

    site:site.name,

    in:new Date()
      .toISOString()

  };


  logs.push(active);


  save(
    LS_ACTIVE,
    active
  );


  save(
    LS_LOGS,
    logs
  );


  updateUI();

  renderHistory();

}


function endShift(){

  if(!active)
    return;


  const idx =
    logs.findIndex(
      l => l.in === active.in
    );


  if(idx > -1){

    logs[idx].out =
      new Date()
        .toISOString();

  }


  active = null;


  save(
    LS_ACTIVE,
    null
  );


  save(
    LS_LOGS,
    logs
  );


  updateUI();

  renderHistory();

}


function selectedSite(){

  if(active)

    return sites.find(
      s => s.name === active.site
    ) || null;


  return sites[0] || null;

}


/* FICHAJE MANUAL */

$("manualIn").onclick = () => {

  const site =
    selectedSite();


  if(!site){

    alert(
      "Primero guarda al menos un centro de trabajo."
    );

    return;

  }


  if(active){

    alert(
      "Ya hay una jornada en curso."
    );

    return;

  }


  startShift(site);


  $("geoMsg").textContent =
    "Entrada registrada manualmente.";

};


$("manualOut").onclick = () => {

  if(!active){

    alert(
      "No hay ninguna jornada en curso."
    );

    return;

  }


  endShift();


  $("geoMsg").textContent =
    "Salida registrada manualmente.";

};


/* GEOLOCALIZACIÓN */

function checkPosition(
  lat,
  lon
){

  if(!sites.length)
    return;


  let inside = null;


  for(
    const s of sites
  ){

    const d =
      distance(
        lat,
        lon,
        s.lat,
        s.lon
      );


    if(
      d <= s.radius
    ){

      inside = s;

      break;

    }

  }


  if(
    inside &&
    !active
  ){

    startShift(
      inside
    );

    navigator.vibrate?.(80);

  }


  if(
    !inside &&
    active
  ){

    endShift();

    navigator.vibrate?.(
      [80,40,80]
    );

  }

}


$("geoBtn").onclick = () => {

  if(
    !navigator.geolocation
  ){

    $("geoMsg").textContent =
      "Este navegador no soporta geolocalización.";

    return;

  }


  navigator.geolocation
    .getCurrentPosition(

      pos => {

        $("geoMsg").textContent =
          "Localización activada. La app vigilará tu posición mientras esté abierta.";

        checkPosition(
          pos.coords.latitude,
          pos.coords.longitude
        );

      },

      err => {

        $("geoMsg").textContent =
          "Permite el acceso a la ubicación en Safari.";

      },

      {
        enableHighAccuracy:true
      }

    );


  if(watchId)

    navigator.geolocation
      .clearWatch(
        watchId
      );


  watchId =
    navigator.geolocation
      .watchPosition(

        pos => {

          checkPosition(
            pos.coords.latitude,
            pos.coords.longitude
          );

        },

        () => {},

        {
          enableHighAccuracy:true,
          maximumAge:10000,
          timeout:10000
        }

      );

};


/* USAR UBICACIÓN */

$("useLocation").onclick =
  () => {

    navigator.geolocation
      .getCurrentPosition(

        pos => {

          $("lat").value =
            pos.coords.latitude
              .toFixed(6);

          $("lon").value =
            pos.coords.longitude
              .toFixed(6);

        }

      );

  };


/* GUARDAR CENTRO */

$("saveSite").onclick =
  () => {

    const site = {

      name:
        $("name")
          .value
          .trim(),

      lat:
        parseFloat(
          $("lat").value
        ),

      lon:
        parseFloat(
          $("lon").value
        ),

      radius:
        parseInt(
          $("radius").value
        ) || 60

    };


    if(
      !site.name ||
      isNaN(site.lat) ||
      isNaN(site.lon)
    ){

      alert(
        "Completa todos los campos"
      );

      return;

    }


    sites.push(site);


    save(
      LS_SITES,
      sites
    );


    $("name").value = "";


    renderSites();

  };


/* BORRAR HISTORIAL */

$("clear").onclick =
  () => {

    if(
      confirm(
        "¿Borrar todo el historial?"
      )
    ){

      logs = [];

      active = null;


      save(
        LS_LOGS,
        logs
      );


      save(
        LS_ACTIVE,
        null
      );


      renderHistory();

      updateUI();

    }

  };


/* INICIO */

renderSites();

renderHistory();

updateUI();


timer =
  setInterval(
    updateUI,
    30000
  );

</script>

</body>
</html>
